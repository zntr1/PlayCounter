[package]
name = "playcounter"
version = "1.7.0"
description = "Launcher-agnostic game play tracker"
authors = ["PlayCounter"]
edition = "2021"

[lib]
name = "playcounter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
# Only the process list is used. The default "multithread" feature spread each
# scan over all cores, which cost more CPU time than a single thread.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
systemicons = "0.9.13"
base64 = "0.22.1"
# Same client and TLS stack as tauri-plugin-updater, for the Epic account import.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Claim secrets and their hashes for kept Xbox sign-ins. Already used by rustls.
ring = "0.17"
# Unpacks GOG's build files, which name a game's achievement id. Already in
# Cargo.lock through Tauri's build step; pure Rust.
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
# PlayStation pads are not XInput devices, so controller navigation reads them over HID.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
webview2-com = "0.38.2"
windows-core = "0.61"
windows-sys = { version = "0.59", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }
# Screenshots (screenshot.rs): Windows Graphics Capture for one frame of the
# game window, Direct3D 11 to read it back, WIC to write the JPEG, and the
# property system for its caption.
windows = { version = "0.59", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
# Only the screenshot spike (examples/screenshot_spike.rs): its hotkey, its
# test window, the game's file name.
windows = { version = "0.59", features = [
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }
