name: Deploy test

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"
  DESKTOP_TAURI_CONFIG: apps/desktop/src-tauri/tauri.conf.json
  AZURE_RELEASE_BASE_URL: https://stplaycountereuw.blob.core.windows.net/releases-test
  AZURE_STORAGE_CONTAINER: releases-test

jobs:
  detect-desktop-version:
    name: Detect desktop version
    runs-on: ubuntu-latest
    # Manual runs build Mac installers only; Windows publishing stays gated by
    # a version change pushed to the test branch.
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.current }}
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current="$(node scripts/ci/read-desktop-version.mjs)"
          changed="true"
          before="${{ github.event.before }}"

          if [ "${before}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${before}:${DESKTOP_TAURI_CONFIG}" 2>/dev/null; then
            tmp_previous="$(mktemp)"
            git show "${before}:${DESKTOP_TAURI_CONFIG}" > "${tmp_previous}"
            previous="$(node scripts/ci/read-desktop-version.mjs "${tmp_previous}")"

            if [ "${current}" = "${previous}" ]; then
              changed="false"
            fi
          fi

          echo "current=${current}" >> "${GITHUB_OUTPUT}"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "Desktop version: ${current}; changed: ${changed}"

  build-desktop-windows:
    name: Build Windows desktop
    runs-on: windows-latest
    needs:
      - detect-desktop-version
    if: needs.detect-desktop-version.outputs.version_changed == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop version sync
        run: node scripts/ci/check-desktop-version-sync.mjs

      - name: Build desktop distributables
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          pnpm --filter @playcounter/shared build
          corepack pnpm --filter @playcounter/desktop tauri:build:test

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-bundle
          path: apps/desktop/src-tauri/target/release/bundle

  build-desktop-macos:
    name: Build macOS test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Produce an installable DMG on every test push, even without a version bump.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: macos-test-${{ matrix.target }}

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check desktop version sync
        run: node scripts/ci/check-desktop-version-sync.mjs

      - name: Build macOS test installer
        run: |
          corepack pnpm --filter @playcounter/shared build
          corepack pnpm --filter @playcounter/desktop tauri:build:macos:test --target ${{ matrix.target }} -- --locked

      - name: Verify bundle and checksum installer
        working-directory: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="../macos/PlayCounter (Test).app"
          info_plist="${app_bundle}/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${info_plist}")" = "app.playcounter.desktop.test"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "${info_plist}")" = "14.0"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${info_plist}")"
          expected_arch="${{ matrix.arch }}"
          if [ "${expected_arch}" = "aarch64" ]; then
            expected_arch="arm64"
          fi
          # -verify_arch treats all following arguments as architecture names.
          lipo "${app_bundle}/Contents/MacOS/${executable}" -verify_arch "${expected_arch}"
          codesign --verify --deep --strict --verbose=2 "${app_bundle}"
          for installer in ./*.dmg; do
            hdiutil verify "${installer}"
          done
          shasum -a 256 ./*.dmg > SHA256SUMS

      - name: Upload macOS test installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}-dmg
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Explain Mac installation
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          Download `desktop-macos-${{ matrix.arch }}-dmg` from this run's **Artifacts**, unzip it, open the DMG, and drag **PlayCounter (Test)** into **Applications**.

          Requires macOS 14 or newer. Choose `aarch64` for Apple silicon (M-series) or `x86_64` for Intel.

          This experimental build is ad-hoc signed and is not notarized. If macOS blocks the first launch, use **System Settings → Privacy & Security → Open Anyway** for this app. Install later test builds by downloading a new DMG; Mac automatic updates are not published yet.

          The test app uses separate local storage and the existing test build's API settings. Steam import, launching, and other Mac functionality still need validation.
          EOF

  publish-desktop:
    name: Publish desktop artifacts
    runs-on: ubuntu-latest
    environment: test
    needs:
      - detect-desktop-version
      - build-desktop-windows
    if: needs.detect-desktop-version.outputs.version_changed == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Windows bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-bundle
          path: .deploy/desktop/windows

      - name: Create updater manifest
        run: node scripts/ci/create-tauri-latest-json.mjs ".deploy/desktop/windows" "${{ env.AZURE_RELEASE_BASE_URL }}" .deploy/desktop/latest.json

      - name: Upload desktop artifacts to Azure Blob Storage
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          set -euo pipefail
          container="${AZURE_STORAGE_CONTAINER:-releases}"

          find .deploy/desktop -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.sig' \) -print0 | while IFS= read -r -d '' file; do
            blob_name="$(basename "$file")"
            case "$file" in
              *desktop-macos-x86_64-bundle*) blob_name="macos-x86_64-${blob_name}" ;;
              *desktop-macos-aarch64-bundle*) blob_name="macos-aarch64-${blob_name}" ;;
            esac

            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --account-key "$AZURE_STORAGE_KEY" \
              --container-name "$container" \
              --name "$blob_name" \
              --file "$file" \
              --overwrite true
          done

          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name "$container" \
            --name latest.json \
            --file .deploy/desktop/latest.json \
            --content-type application/json \
            --overwrite true
